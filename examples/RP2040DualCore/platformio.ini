; T1 smoke test for Phase 3 (Trovis RP2040 MySensors telemetry).
;
; Verifies that, with the macro-injection MyMainRP2040.cpp fix:
;   1. MySensors (MY_RADIO_RFM95) compiles for RP2040 / arduino-pico
;   2. `#include <main.cpp>` resolves to the arduino-pico core main (NOT this
;      project's src/main.cpp) despite the identical filename
;   3. the core's multicore_launch_core1() is preserved, so setup1()/loop1()
;      run on Core 1 alongside MySensors on Core 0
;
; No radio module is required: MY_TRANSPORT_WAIT_READY_MS bounds the wait so the
; node boots even with no RFM95 attached.

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m

monitor_speed = 115200
monitor_filters = direct
upload_protocol = picotool

build_flags =
    -Os
    -I../../            ; MySensors root

lib_deps =
    EEPROM
    SPI

build_src_filter =
    +<*>
    +<../../hal/architecture/RP2040/MyHwRP2040.cpp>
